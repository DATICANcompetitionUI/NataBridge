<section class="p-5">
     <h2 class="capitalize" nata-h2>You are logging out</h2>

     <p>You are logging out. Do you want to continue?</p>

     <div class="mt-5 flex-center gap-x-2.5 justify-end">
          <button class="nata-btn secondary capitalize" (click)="closeDialog(false)">
               No, stay logged in
          </button>
          <button class="nata-btn primary capitalize" (click)="closeDialog(true)">
               Yes
          </button>
     </div>
</section>
