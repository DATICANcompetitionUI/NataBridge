<section class="consent-dialog" aria-labelledby="consent-dialog-title">
  <header class="dialog-heading">
    <span class="dialog-symbol" aria-hidden="true">◆</span>
    <div>
      <span class="dialog-kicker">Before you continue</span>
      <h2 id="consent-dialog-title">Assessment consent</h2>
    </div>
  </header>

  <div class="dialog-body">
    <p>
      I understand that this assessment provides an AI-generated risk prediction and does not
      replace diagnosis or treatment by a qualified healthcare professional.
    </p>

    <aside class="dialog-note">
      <span aria-hidden="true">i</span>
      <p>Your submitted measurements will be used to generate this assessment result.</p>
    </aside>
  </div>

  <footer class="dialog-actions">
    <button
      class="assessment-button assessment-button--secondary"
      type="button"
      (click)="closeDialog(false)"
    >
      Cancel
    </button>
    <button
      class="assessment-button assessment-button--primary"
      type="button"
      (click)="closeDialog(true)"
    >
      I understand, continue
    </button>
  </footer>
</section>
