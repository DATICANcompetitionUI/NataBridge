<div [ngStyle]="{
     'background-color': riskColor().background,
     'border': '1px solid ' + riskColor().border,
     'color': riskColor().text
}">
     <div class="sticky z-10 top-0 header-box-shadow">
          <nata-test-nav-bar />
     </div>

     <section class="px-10 max-sm:px-0 pt-8.5">
          <nata-assessment-result [result]="result()" [styles]="riskColor()" [userInput]="input()" />
     </section>
</div>
