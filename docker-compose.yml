services:
  ai:
    build:
      context: ./ai
    container_name: natabridge-ai
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    container_name: natabridge-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - ai

  frontend:
    build:
      context: ./frontend
    container_name: natabridge-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend