services:

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: natabridge_ai
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: natabridge_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - ai
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: natabridge_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

  db:
    image: postgres:18
    container_name: natabridge_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password
      POSTGRES_DB: natabridge
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: